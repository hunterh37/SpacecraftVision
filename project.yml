name: VisionSpacecraft
options:
  bundleIdPrefix: org.dicyaninlabs
  deploymentTarget:
    visionOS: "26.0"
  xcodeVersion: "26.0"
packages:
  RealityHD:
    url: https://github.com/hunterh37/RealityHD.git
    branch: main
  SpacecraftKit:
    path: Packages/SpacecraftKit
  TaskGuideKit:
    path: Packages/TaskGuideKit
  DicyaninStageDirector:
    url: https://github.com/hunterh37/DicyaninStageDirector.git
    from: 0.1.0
targets:
  VisionSpacecraft:
    type: application
    platform: visionOS
    sources:
      - path: VisionSpacecraft
    dependencies:
      - package: RealityHD
        product: RealityHD
      - package: SpacecraftKit
        product: SpacecraftCore
      - package: SpacecraftKit
        product: FlightSim
      - package: SpacecraftKit
        product: FlightCode
      - package: SpacecraftKit
        product: FlightRunner
      - package: SpacecraftKit
        product: Curriculum
      - package: SpacecraftKit
        product: LabUI
      - package: TaskGuideKit
        product: TaskGuideCore
      - package: TaskGuideKit
        product: TaskGuideUI
      - package: DicyaninStageDirector
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.dicyaninlabs.visionspacecraft
        DEVELOPMENT_TEAM: NWR2UZ4V67
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "RocketCraft"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: RocketCraft
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Polea-ExtraBold.otf
          - Kregan.otf
          - Nebula-Regular.otf
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
schemes:
  VisionSpacecraft:
    build:
      targets:
        VisionSpacecraft: all

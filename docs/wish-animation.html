<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RocketCraft Wish</title>
<style>
@font-face { font-family: "Polea"; src: url("../fonts/Polea-ExtraBold.otf"); }
@font-face { font-family: "Nebula"; src: url("../fonts/Nebula-Regular.otf"); }
html, body { margin: 0; height: 100%; background: #070826; overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.ui { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 10px; transition: opacity .5s; z-index: 2; }
.ui.hide { opacity: 0; pointer-events: none; }
button { font: 600 12px/1 "Nebula", system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #eafffb; cursor: pointer;
  background: rgba(14, 16, 74, .78); border: 1px solid rgba(159, 251, 232, .45); border-radius: 999px; padding: 12px 20px; backdrop-filter: blur(10px);
  box-shadow: 0 0 24px rgba(53, 240, 208, .25); }
button:hover { background: rgba(40, 44, 130, .9); }
:focus-visible { outline: 2px solid #35f0d0; outline-offset: 3px; }
#hint { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 3; font: 11px "Nebula", sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #cffff4; background: rgba(14, 16, 74, .6); border: 1px solid rgba(159, 251, 232, .35); border-radius: 999px; padding: 9px 16px; pointer-events: none; animation: nudge 2.4s ease-in-out infinite; }
#hint[hidden] { display: none; }
@keyframes nudge { 50% { opacity: .45; } }
body.embed .ui { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="cv" aria-label="Animated wish sequence ending in the RocketCraft logo" role="img"></canvas>
<div id="hint" hidden>Tap for sound</div>
<div class="ui hide" id="ui"><button id="replay">Replay</button><button id="mute" aria-pressed="false">Sound on</button></div>

<script>
(() => {
'use strict';
const cv = document.getElementById('cv'), c = cv.getContext('2d');
let W = 0, H = 0;
function fit() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; c.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', fit); fit();

// ------------------------------------------------------------ helpers
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t;
const eo3 = (t) => 1 - Math.pow(1 - clamp(t), 3), ei2 = (t) => clamp(t) ** 2;
const eio = (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eob = (t) => { t = clamp(t); const s = 1.70158; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
function rng(seed) { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };
const K = { ink: '#070826', navy: '#0d0f4a', indigo: '#1b1a6b', royal: '#2c2490', blue: '#3d6bff', sky: '#59b8ff', violet: '#7b3dff', purple: '#a35cff', magenta: '#c2208e', pink: '#ff5fa8', red: '#e8365d', teal: '#35f0d0', aqua: '#9ffbe8', white: '#ffffff', gold: '#ffd86b' };

// Timeline (seconds)
const T = { meteor: 1.0, impact: 3.9, galaxyDone: 6.6, jets: 5.0, white0: 6.45, logo: 7.0, word: 7.7, sub: 8.5, stars: 8.9, end: 11 };

// ------------------------------------------------------------ seeded scene data
const R = rng(2077);
const STARS = Array.from({ length: 170 }, () => ({ x: R(), y: R() * 0.78, s: 0.6 + R() * 1.8, p: R() * TAU, k: R() < 0.08 }));
function makeCloud(x, y, s, layer) {
  // One silhouette built from lobes in two rows, plus small side puffs and a base slab. All units are fractions of H.
  const bumps = [], nA = 5 + Math.floor(R() * 3), mA = (nA - 1) / 2, step = s * 0.68;
  for (let i = 0; i < nA; i++) { const f = 1 - Math.abs(i - mA) / (mA + 0.8); bumps.push({ dx: (i - mA) * step + (R() - 0.5) * s * 0.12, dy: -s * 0.05 * R(), r: s * (0.34 + 0.3 * f) * (0.88 + R() * 0.28) }); }
  const nB = 2 + Math.floor(R() * 2);
  for (let i = 0; i < nB; i++) bumps.push({ dx: (R() - 0.5) * mA * step * 1.2, dy: -s * (0.34 + R() * 0.2), r: s * (0.36 + R() * 0.2) });
  bumps.push({ dx: -mA * step - s * 0.38, dy: s * 0.04, r: s * 0.26 }, { dx: mA * step + s * 0.42, dy: s * 0.03, r: s * 0.3 });
  const base = bumps.filter((b) => b.dy >= -s * 0.06), x0 = Math.min(...base.map((b) => b.dx)), x1 = Math.max(...base.map((b) => b.dx));
  const covered = (px, py, self) => { for (let j = 0; j < bumps.length; j++) if (j !== self && Math.hypot(px - bumps[j].dx, py - bumps[j].dy) < bumps[j].r - 1e-4) return true; return py > 1e-4 && px > x0 && px < x1; };
  bumps.forEach((b, i) => { // only the arcs that face the sky and are not buried inside a neighbouring lobe get rim light
    b.runs = []; let run = null;
    for (let a = -PI; a <= 1e-4; a += PI / 48) {
      const open = !covered(b.dx + Math.cos(a) * b.r, b.dy + Math.sin(a) * b.r, i);
      if (open) { if (!run) run = [a, a]; else run[1] = a; } else if (run) { b.runs.push(run); run = null; }
    }
    if (run) b.runs.push(run);
  });
  const dots = Array.from({ length: 6 }, () => ({ dx: x0 - s + R() * (x1 - x0 + s * 2), dy: -s * (0.9 + R() * 0.9), r: 0.002 + R() * 0.005 }));
  const solid = layer === 'front' || layer === 'sea';
  return { x, y, layer, bumps, x0, x1, bh: solid ? s * 1.5 : s * 0.34, w: x1 - x0 + s * 1.6, dots, alt: R() < 0.22, v: (0.4 + R() * 0.6) * ({ back: 1, mid: 1.6, sea: 2, front: 2.6 }[layer]) };
}
const CLOUDS = [];
for (let i = 0; i < 5; i++) CLOUDS.push(makeCloud(R(), 0.6 + R() * 0.06, 0.06 + R() * 0.025, 'back'));
for (let i = 0; i < 5; i++) CLOUDS.push(makeCloud(R(), 0.7 + R() * 0.07, 0.085 + R() * 0.025, 'mid'));
for (let i = 0; i < 7; i++) CLOUDS.push(makeCloud(i / 6 + (R() - 0.5) * 0.08, 0.87 + R() * 0.04, 0.12 + R() * 0.03, 'sea'));
for (let i = 0; i < 8; i++) CLOUDS.push(makeCloud(i / 7 + (R() - 0.5) * 0.06, 0.975 + R() * 0.025, 0.15 + R() * 0.04, 'front'));
const CLOUD_STYLE = {
  back: { fill: '#161b78', shade: '#0f1458', rim: '#4a7bff', hi: '#9ab8ff', outline: '#0b0e46' },
  mid: { fill: '#2a33b0', shade: '#1e2590', rim: '#59e0ff', hi: '#ffffff', outline: '#121a6e' },
  sea: { fill: '#1d2596', shade: '#141a76', rim: '#7ee8ff', hi: '#e6fbff', outline: '#0c1250' },
  front: { fill: '#0d1258', shade: '#080b3c', rim: '#35f0d0', hi: '#b8fff0', outline: '#050728' },
};
const RING_COL = [K.teal, K.white, K.blue, K.violet, K.magenta, K.aqua, K.sky, K.pink, K.white, K.purple];
const RINGS = Array.from({ length: 10 }, (_, i) => {
  const rf = 0.14 + (i / 9) * 0.86, dashes = []; let a = R() * TAU;
  while (a < TAU * 2) { const len = 0.12 + R() * 0.75, gap = 0.1 + R() * 0.5; dashes.push({ a, len }); a += len + gap; if (dashes.length > 24) break; }
  return { rf, dashes, col: RING_COL[i], w: (0.014 + R() * 0.018) * (1.15 - rf * 0.4), om: 0.16 + (1.1 - rf) * 0.55 };
});
const BLOBS = Array.from({ length: 70 }, () => ({ rf: 0.2 + R() * 0.88, a: R() * TAU, r: 0.006 + R() * 0.022, col: [K.magenta, K.purple, K.blue, K.aqua, K.pink, K.sky][Math.floor(R() * 6)], om: 0.1 + R() * 0.4, dz: (R() - 0.5) * 0.08 }));
const SPARKS = Array.from({ length: 48 }, () => ({ a: R() * TAU, v: 0.25 + R() * 0.6, len: 0.02 + R() * 0.05, col: [K.teal, K.aqua, K.white, K.pink, K.sky, K.gold][Math.floor(R() * 6)], w: 0.004 + R() * 0.006 }));
const TAILSPK = Array.from({ length: 70 }, () => ({ k: 0.04 + R() * 0.96, lat: (R() - 0.5) * 2, s: 0.004 + R() * 0.008, ph: R() * TAU, col: [K.aqua, K.white, K.sky, K.pink, K.purple][Math.floor(R() * 5)] }));
const SPARKLES = Array.from({ length: 22 }, () => ({ a: R() * TAU, d: 0.14 + R() * 0.3, s: 0.008 + R() * 0.016, ph: R() * TAU, col: [K.aqua, K.white, K.gold, K.pink][Math.floor(R() * 4)] }));

// ------------------------------------------------------------ primitives
function star4(x, y, r, col, a = 1) {
  c.save(); c.globalAlpha *= a; c.fillStyle = col; c.beginPath();
  c.moveTo(x, y - r); c.quadraticCurveTo(x, y, x + r, y); c.quadraticCurveTo(x, y, x, y + r); c.quadraticCurveTo(x, y, x - r, y); c.quadraticCurveTo(x, y, x, y - r); c.fill(); c.restore();
}
function star5(x, y, r, col) {
  c.fillStyle = col; c.beginPath();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * 0.46 : r, a = -PI / 2 + (i * PI) / 5; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath(); c.fill();
}
function glow(x, y, r, col, steps = 5, a = 0.14) { // flat, stepped glow in the Kurzgesagt manner
  c.save(); c.fillStyle = col;
  for (let i = steps; i >= 1; i--) { c.globalAlpha = a * (1 + (steps - i) * 0.35); c.beginPath(); c.arc(x, y, (r * i) / steps, 0, TAU); c.fill(); }
  c.restore();
}
function pill(x1, y1, x2, y2, w, col, a = 1) { c.save(); c.globalAlpha *= a; c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.restore(); }

// ------------------------------------------------------------ sky, stars, clouds
function sky(t) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#05061c'); g.addColorStop(0.5, '#10125a'); g.addColorStop(0.8, '#2a2196'); g.addColorStop(1, '#2d1fa0');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // horizon bands: flat stepped glow
  const hb = [['#3a2bc0', 0.0], ['#4a37d8', 0.05], ['#6a46ee', 0.1]];
  hb.forEach(([col, d]) => { c.fillStyle = col; c.globalAlpha = 0.28; c.beginPath(); c.ellipse(W * 0.5, H * 0.92, W * (0.8 - d), H * (0.34 - d * 1.2), 0, 0, TAU); c.fill(); });
  c.globalAlpha = 1;
}
function stars(t, wall) {
  STARS.forEach((s) => {
    const tw = 0.55 + 0.45 * Math.sin(wall * (1 + s.s) + s.p), x = s.x * W, y = s.y * H;
    if (s.k) star4(x, y, 3 + s.s * 2.2 * tw, K.aqua, 0.9 * tw); else { c.fillStyle = '#dfe6ff'; c.globalAlpha = 0.35 + 0.5 * tw; c.fillRect(x, y, s.s, s.s); c.globalAlpha = 1; }
  });
}
function push(x, t) { const s = eo3(seg(t, T.impact, T.impact + 1.8)), d = (x - W * 0.5) / W; return Math.sign(d || 1) * W * 0.17 * s * Math.exp(-Math.abs(d) * 2.6); }
function clouds(t, wall, layer) {
  CLOUDS.filter((cl) => cl.layer === layer).forEach((cl) => {
    const st = Object.assign({}, CLOUD_STYLE[layer], cl.alt ? { rim: '#a98bff', hi: '#eadfff' } : {});
    const span = W + cl.w * H * 2; let x = ((cl.x * span + wall * cl.v * 3) % span) - cl.w * H;
    x += push(x, t);
    const y = cl.y * H, lw = Math.max(2, H * 0.0085), p = new Path2D();
    cl.bumps.forEach((b) => { p.moveTo((b.dx + b.r) * H, b.dy * H); p.arc(b.dx * H, b.dy * H, b.r * H, 0, TAU); });
    const bw = (cl.x1 - cl.x0) * H; p.roundRect(cl.x0 * H, 0, bw, cl.bh * H, Math.min(cl.bh * H * 0.5, H * 0.04));
    const top = Math.min(...cl.bumps.map((b) => b.dy - b.r)) * H, mid = (cl.x0 + cl.x1) / 2 * H;
    c.save(); c.translate(x, y); c.lineJoin = 'round';
    c.strokeStyle = st.outline; c.lineWidth = H * 0.009; c.stroke(p); c.fillStyle = st.fill; c.fill(p);
    c.save(); c.clip(p);
    c.fillStyle = st.shade; c.beginPath(); c.ellipse(mid, cl.bh * H * 0.35 + H * 0.02, bw * 0.85 + H * 0.1, -top * 0.62, 0, 0, TAU); c.fill();     // belly shadow
    c.globalAlpha = 0.16; c.fillStyle = st.rim; c.beginPath(); c.ellipse(mid - bw * 0.18, top * 0.55, bw * 0.38 + H * 0.05, -top * 0.28, -0.12, 0, TAU); c.fill(); c.globalAlpha = 1;  // soft light on the crown
    c.restore();
    c.lineCap = 'round';
    cl.bumps.forEach((b) => b.runs.forEach(([a0, a1]) => {                      // rim light hugging the silhouette
      if (a1 - a0 < 0.05) return;
      const rr = b.r * H - lw * 0.9; if (rr < 2) return;
      c.strokeStyle = st.rim; c.lineWidth = lw; c.beginPath(); c.arc(b.dx * H, b.dy * H, rr, a0, a1); c.stroke();
      const h0 = Math.max(a0, -PI * 0.92), h1 = Math.min(a1, -PI * 0.42);       // thin second highlight, upper-left only
      if (h1 - h0 > 0.12 && b.r * H - lw * 2.4 > 2) { c.strokeStyle = st.hi; c.lineWidth = lw * 0.42; c.beginPath(); c.arc(b.dx * H, b.dy * H, b.r * H - lw * 2.4, h0 + 0.05, h1 - 0.05); c.stroke(); }
    }));
    c.fillStyle = st.rim; cl.dots.forEach((d) => { c.globalAlpha = 0.55; c.beginPath(); c.arc(d.dx * H, d.dy * H, d.r * H, 0, TAU); c.fill(); }); c.globalAlpha = 1;
    c.restore();
  });
}

// ------------------------------------------------------------ meteor
// Flight path: a quadratic arc that sweeps across the sky, then dives into the impact point.
const MS = () => ({ x: -W * 0.1, y: H * 0.17 }), MC = () => ({ x: W * 0.66, y: H * 0.0 }), ME = () => ({ x: W * 0.5, y: H * 0.5 });
function pathAt(u) { const S = MS(), C = MC(), E = ME(), a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, d = u * u; return { x: a * S.x + b * C.x + d * E.x, y: a * S.y + b * C.y + d * E.y }; }
function pathDir(u) { const S = MS(), C = MC(), E = ME(), dx = 2 * (1 - u) * (C.x - S.x) + 2 * u * (E.x - C.x), dy = 2 * (1 - u) * (C.y - S.y) + 2 * u * (E.y - C.y), m = Math.hypot(dx, dy) || 1; return { x: dx / m, y: dy / m, m }; }
function rocket(L, Wd, wall, boost, roll) {
  // Soft, chunky space-shuttle stack in the scene's flat style. Points along +x, seen from above, and rolls about its long axis:
  // boosters and wings swing around the tank (cos/sin of the roll) and are depth-sorted so they pass in front of and behind it.
  const ink = K.navy, lw = Math.max(2.4, L * 0.02), fl = 0.62 + 0.14 * Math.sin(wall * 38) + 0.08 * Math.sin(wall * 61), by = L * 0.2;
  const cr = Math.cos(roll), sr = Math.sin(roll), under = cr < 0, WHITE = '#f1f2ff', SHADE = '#b3b9f7', DARK = '#252a6e';
  c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = ink; c.lineWidth = lw;
  const flame = (y, x0, len, w, cols) => cols.forEach(([f, col]) => {
    const l = len * f, ww = w * f + w * 0.12; c.fillStyle = col; c.beginPath();
    c.moveTo(x0, y - ww); c.bezierCurveTo(x0 - l * 0.55, y - ww * 1.25, x0 - l * 0.95, y - ww * 0.5, x0 - l, y); c.bezierCurveTo(x0 - l * 0.95, y + ww * 0.5, x0 - l * 0.55, y + ww * 1.25, x0, y + ww); c.closePath(); c.fill();
  });
  [-1, 1].forEach((sd) => flame(sd * by * cr, -L * 0.47, L * fl * (1 + boost), L * 0.058, [[1, '#ff7a59'], [0.72, K.gold], [0.42, K.white]]));
  [-1, 1].forEach((sd) => flame(sd * L * 0.035 - L * 0.1 * sr, -L * 0.44, L * 0.3 * (fl + 0.2), L * 0.026, [[1, K.sky], [0.6, K.aqua], [0.3, K.white]]));
  const parts = [];
  [1, -1].forEach((sd) => parts.push({ z: sd * by * sr, draw: () => {                           // solid rocket booster: a capsule
    const y = sd * by * cr, h = L * 0.066, p = new Path2D(); p.roundRect(-L * 0.45, y - h, L * 0.9, h * 2, [h * 0.7, h, h, h * 0.7]);
    c.fillStyle = '#2a2f8e'; c.beginPath(); c.roundRect(-L * 0.52, y - h * 0.62, L * 0.1, h * 1.24, h * 0.4); c.fill(); c.stroke();
    c.fillStyle = WHITE; c.fill(p); c.save(); c.clip(p); c.fillStyle = SHADE; c.fillRect(-L, y + (sd > 0 ? h * 0.15 : -h), L * 2, h * 0.85);
    c.fillStyle = K.red; c.fillRect(L * 0.05, y - h, L * 0.04, h * 2); c.fillStyle = '#2a2f8e'; c.fillRect(-L * 0.45, y - h, L * 0.05, h * 2); c.restore(); c.stroke(p);
  } }));
  parts.push({ z: 0, draw: () => {                                                              // external tank: orange capsule with a blunt nose
    const eh = L * 0.122, p = new Path2D(); p.roundRect(-L * 0.4, -eh, L * 0.98, eh * 2, [eh * 0.5, eh, eh, eh * 0.5]);
    c.fillStyle = '#e8803c'; c.fill(p); c.save(); c.clip(p);
    c.fillStyle = '#c2551f'; c.fillRect(-L, eh * 0.2, L * 2, eh); c.fillStyle = '#f7a35c'; c.fillRect(-L, -eh, L * 2, eh * 0.3);
    c.fillStyle = 'rgba(120,40,10,.4)'; [0.0, 0.17].forEach((x) => c.fillRect(L * x, -eh, L * 0.014, eh * 2)); c.restore(); c.stroke(p);
  } });

    const zo = L * 0.1;
    c.save(); c.translate(0, -zo * sr); c.save(); c.scale(1, cr || 0.001);

      const p = new Path2D(); p.moveTo(L * 0.03, sd * L * 0.075); p.lineTo(-L * 0.36, sd * L * 0.3); p.quadraticCurveTo(-L * 0.47, sd * L * 0.35, -L * 0.47, sd * L * 0.24); p.lineTo(-L * 0.47, sd * L * 0.08); p.closePath();
      c.fillStyle = under ? DARK : WHITE; c.fill(p); c.save(); c.clip(p); c.strokeStyle = under ? WHITE : DARK; c.lineWidth = L * 0.04; c.globalAlpha = 0.9; c.beginPath(); c.moveTo(L * 0.03, sd * L * 0.075); c.lineTo(-L * 0.36, sd * L * 0.3); c.stroke(); c.globalAlpha = 1;
      c.fillStyle = K.red; c.fillRect(-L * 0.47, sd > 0 ? L * 0.25 : -L * 0.35, L * 0.05, L * 0.1); c.restore(); c.strokeStyle = ink; c.lineWidth = lw; c.stroke(p);
    });
    c.restore();

    c.fillStyle = under ? '#4a50b8' : SHADE; c.fillRect(-L, fh * 0.2, L * 2, fh); c.fillStyle = K.teal; c.fillRect(-L * 0.28, -fh, L * 0.03, fh * 2); c.restore(); c.stroke(fu);

function meteor(t, wall) {

  const Wd = H * (0.045 + 0.035 * u), L = Wd * 3.9, ang = Math.atan2(uy, ux), roll = Math.pow(p, 1.25) * TAU * 2;     // two barrel rolls, ending upright

  stopAudio(); master = actx.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(actx.destination);
  const t0 = actx.currentTime + 0.05, at = (s) => t0 + s - el;
  const env = (g, s, a, peak, rel) => { g.gain.setValueAtTime(0.0001, at(s)); g.gain.linearRampToValueAtTime(peak, at(s + a)); g.gain.exponentialRampToValueAtTime(0.0001, at(s + a + rel)); };
  const osc = (type, f0, s, dur, fn) => { if (s < el - 0.02) return; const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(f0, at(s)); fn && fn(o, g); o.connect(g); g.connect(master); o.start(at(s)); o.stop(at(s + dur)); nodes.push(o); return { o, g }; };

  nz(T.meteor, T.impact - T.meteor, 'bandpass', 300, 4200, 0.5, T.impact - T.meteor - 0.1, 0.12);                  // rocket whoosh
  nz(T.meteor, T.impact - T.meteor, 'lowpass', 240, 900, 0.32, 1.4, 0.15);                                            // engine rumble
  const boom = osc('sine', 130, T.impact, 2.4, (o, g) => { o.frequency.exponentialRampToValueAtTime(34, at(T.impact + 1.4)); env(g, T.impact, 0.01, 0.95, 2.2); });
  nz(T.impact, 1.4, 'lowpass', 1800, 160, 0.55, 0.01, 1.2);                                                          // impact thump
  [261.63, 329.63, 392, 493.88].forEach((f, i) => osc('sine', f, T.impact + 0.3, 4, (o, g) => { env(g, T.impact + 0.3, 2.2, 0.05, 1.8); o.detune.value = (i - 1.5) * 4; }));   // galaxy pad
  osc('sawtooth', 150, 5.5, 1.6, (o, g) => { o.frequency.exponentialRampToValueAtTime(1100, at(7.0)); env(g, 5.5, 1.4, 0.08, 0.1); });                          // riser
  [523.25, 659.25, 783.99, 987.77, 1318.5].forEach((f, i) => { const s = T.logo + 0.06 * i; osc('triangle', f, s, 2.4, (o, g) => env(g, s, 0.01, 0.15, 2.0)); osc('sine', f * 2, s, 1.6, (o, g) => env(g, s, 0.01, 0.05, 1.2)); });   // logo chime
  for (let i = 0; i < 5; i++) { const s = T.stars + i * 0.12; osc('sine', 1568 * (1 + 0.12 * i), s, 0.7, (o, g) => env(g, s, 0.005, 0.07, 0.5)); }                  // star plinks
}

// ------------------------------------------------------------ run loop and controls
const qs = new URLSearchParams(location.search), embed = qs.has('embed'), frozen = qs.has('t') ? parseFloat(qs.get('t')) : null;
let t0 = null, started = false, doneTimer = null;
if (embed) document.body.classList.add('embed');
const ui = document.getElementById('ui'), hint = document.getElementById('hint');
function armAudio() {                                                   // browsers block sound until a gesture: start it in sync as soon as there is one
  try { startAudio(0); } catch (e) { console.warn('audio unavailable', e); return; }
  setTimeout(() => {
    if (actx && actx.state === 'running') return;
    hint.hidden = false;
    const go = () => { ['pointerdown', 'keydown', 'touchstart'].forEach((ev) => removeEventListener(ev, go)); hint.hidden = true; try { startAudio(Math.max(0, (performance.now() - t0) / 1000)); } catch (e) { /* no audio */ } };

}
function begin() {

  armAudio();
  clearTimeout(doneTimer); if (embed) doneTimer = setTimeout(() => parent.postMessage({ type: 'wish-done' }, '*'), (T.end + 0.6) * 1000);
}
document.getElementById('replay').onclick = begin;
document.getElementById('mute').onclick = (e) => { muted = !muted; e.target.textContent = muted ? 'Sound off' : 'Sound on'; e.target.setAttribute('aria-pressed', String(muted)); if (master) master.gain.value = muted ? 0 : 0.8; };
addEventListener('message', (e) => { if (e.data && e.data.type === 'fade' && master) { master.gain.cancelScheduledValues(actx.currentTime); master.gain.setTargetAtTime(0, actx.currentTime, 0.25); } });
function frame(now) {
  requestAnimationFrame(frame);                                              // schedule first: one bad frame must not freeze the scene
  const wall = now / 1000, t = frozen !== null ? frozen : started ? (now - t0) / 1000 : 0.4;
  try { draw(Math.max(0, t), frozen !== null ? frozen : wall); } catch (e) { if (!frame.warned) { frame.warned = true; console.error('wish frame failed', e); } }
}
(document.fonts ? Promise.all([document.fonts.load('40px Polea'), document.fonts.load('20px Nebula')]) : Promise.resolve()).catch(() => {}).then(() => { requestAnimationFrame(frame); if (frozen === null) begin(); });
window.__wish = { draw, T };
})();
